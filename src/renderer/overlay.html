<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:;">
<title>Pip</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    /* the overlay covers the whole work area, so nothing here may take a cursor
       or a selection - Pip is the only thing the mouse can reach */
    cursor: default;
    user-select: none;
    -webkit-user-select: none;
  }
  #stage {
    position: absolute;
    inset: 0;
    display: block;
    background: transparent;
  }
</style>
</head>
<body>
  <canvas id="stage"></canvas>

  <script src="palettes.js"></script>
  <script src="traits.js"></script>
  <script src="pips.js"></script>
  <script src="sprites.js"></script>
  <script src="compose.js"></script>
  <script src="animations.js"></script>
  <script src="physics.js"></script>
  <script src="particles.js"></script>
  <script src="bubbles.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
