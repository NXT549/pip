name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # The tests need no install: they use Node's built-in runner and never
      # load Electron (main.test.js fakes it).
      - run: npm test

  # The evidence that Pip runs on macOS: the tests, the real app from source,
  # and a freshly built universal Pip.app run on both chips (its Intel half
  # under Rosetta), all on a real Mac. The .dmg it keeps is the release
  # build: one download for every Mac.
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm test
      - run: npm ci
      - name: Smoke test from source
        run: npm run smoke
      - name: Build Pip.app and the .dmg
        run: npm run dist:mac
        env:
          # electron-builder skips signing on pull requests to keep real
          # certificates away from forks. Pip only ever signs ad hoc, and an
          # Apple silicon Mac will not run an app that is not signed at all.
          CSC_FOR_PULL_REQUEST: 'true'
      - name: Check the app is universal, signed and stays out of the Dock
        run: |
          test "$(ls -d dist/mac*/Pip.app | wc -l)" -eq 1
          app="$(ls -d dist/mac*/Pip.app)"
          archs="$(lipo -archs "$app/Contents/MacOS/Pip")"
          echo "$archs"
          case " $archs " in
            *" x86_64 "*) ;;
            *) echo "no Intel half"; exit 1 ;;
          esac
          case " $archs " in
            *" arm64 "*) ;;
            *) echo "no Apple silicon half"; exit 1 ;;
          esac
          codesign --verify --deep --strict --verbose=2 "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSUIElement' "$app/Contents/Info.plist")" = true
          test "$(ls dist/*.dmg | wc -l)" -eq 1
          hdiutil verify dist/*.dmg
      - name: Smoke test the packaged app on both chips
        run: |
          bin="$(ls -d dist/mac*/Pip.app)/Contents/MacOS/Pip"
          node scripts/smoke.js "$bin"
          # Rosetta translates the Intel half as it runs, a minute or more
          # before Pip's own code starts and slowly after that, so both the
          # smoke script and the app get far longer than their usual 20 s.
          SMOKE_TIMEOUT_MS=300000 node scripts/smoke.js arch -x86_64 "$bin"
      - uses: actions/upload-artifact@v4
        with:
          name: Pip-mac
          path: dist/Pip-*.dmg
          retention-days: 14
