name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # The tests need no install: they use Node's built-in runner and never
      # load Electron (main.test.js fakes it).
      - run: npm test

  # The evidence that Pip runs on macOS: the tests, the real app from source,
  # and freshly built Pip.apps for Apple silicon and Intel (run under
  # Rosetta), each on a real Mac. The .dmgs it keeps are the release builds.
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm test
      - run: npm ci
      - name: Smoke test from source
        run: npm run smoke
      - name: Build Pip.app and the .dmgs
        run: npm run dist:mac -- --arm64 --x64
        env:
          # electron-builder skips signing on pull requests to keep real
          # certificates away from forks. Pip only ever signs ad hoc, and an
          # Apple silicon Mac will not run an app that is not signed at all.
          CSC_FOR_PULL_REQUEST: 'true'
      - name: Check each app is signed and stays out of the Dock
        run: |
          test "$(ls -d dist/mac*/Pip.app | wc -l)" -eq 2
          for app in dist/mac*/Pip.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            test "$(/usr/libexec/PlistBuddy -c 'Print :LSUIElement' "$app/Contents/Info.plist")" = true
          done
          for dmg in dist/*.dmg; do hdiutil verify "$dmg"; done
      - name: Smoke test each packaged app
        env:
          # Rosetta translates the Intel app as it first runs, which can take
          # longer than the whole smoke test normally gets.
          SMOKE_TIMEOUT_MS: '180000'
        run: |
          for app in dist/mac*/Pip.app; do
            bin="$app/Contents/MacOS/Pip"
            lipo -archs "$bin"
            if [ "$(lipo -archs "$bin")" = x86_64 ]; then
              # The first launch under Rosetta is translated piece by piece
              # (the settings window's helper last), slowly enough to trip
              # the app's own 20 s smoke deadline. Warm it up once, then test.
              node scripts/smoke.js "$bin" || echo "Rosetta warm-up run finished"
            fi
            node scripts/smoke.js "$bin"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: Pip-mac
          path: dist/*.dmg
          retention-days: 14
