name: Release

# Builds the installers and attaches them to a GitHub release, so the
# README's Download links work without anyone uploading files by hand.
#
# It runs by itself when a release is published, building that release's
# tag. To fill a release that already exists, run it from the Actions tab
# ("Run workflow") and give the release's tag: it then builds the branch you
# run it on, normally main.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the release to attach the installers to, e.g. v1.2.0
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm test
      - run: npm ci
      # --publish never: electron-builder otherwise tries to publish on its
      # own when it sees a tag in CI. This workflow does the uploading.
      - run: npm run dist -- --publish never
      - name: Check the installers are named for this release
        run: |
          version="${TAG#v}"
          test -f "dist/Pip-Setup-$version.exe"
          test -f "dist/Pip-Portable-$version.exe"
      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          gh release upload "$TAG" --clobber \
            "dist/Pip-Setup-$version.exe" "dist/Pip-Portable-$version.exe"

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm test
      - run: npm ci
      # --universal: one Pip.app holding both the Apple silicon and the
      # Intel build, so a release needs a single Mac download.
      - run: npm run dist:mac -- --universal --publish never
      - name: Check there is one .dmg that runs on every Mac
        run: |
          version="${TAG#v}"
          test "$(ls dist/*.dmg | wc -l)" -eq 1
          test -f "dist/Pip-$version-universal.dmg"
          app=dist/mac-universal/Pip.app
          archs="$(lipo -archs "$app/Contents/MacOS/Pip")"
          echo "Pip.app is built for: $archs"
          case "$archs" in
            *x86_64*arm64*|*arm64*x86_64*) ;;
            *) echo "::error::The Mac build is not universal, so it would not run on every Mac."; exit 1 ;;
          esac
          minos="$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist")"
          echo "Pip.app needs macOS $minos or later"
          if [ "${minos%%.*}" -gt 12 ]; then
            echo "::error::Pip.app needs macOS $minos, so it would not open on macOS 12 (Monterey)."; exit 1
          fi
          codesign --verify --deep --strict "$app"
          hdiutil verify "dist/Pip-$version-universal.dmg"
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          gh release upload "$TAG" --clobber "dist/Pip-$version-universal.dmg"
